<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>i|one</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffff">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bangers&family=Bebas+Neue&family=Cinzel:wght@400;600;700&family=Dancing+Script:wght@400;600;700&family=Lobster&family=Monoton&family=Orbitron:wght@400;600;700;800&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@400;600;700;800&family=Press+Start+2P&family=Righteous&family=Roboto:wght@400;500;700&family=Russo+One&family=Satisfy&family=Special+Elite&display=swap" rel="stylesheet">

 <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

 <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

 <!-- Supabase public client key: safe for browser use. NEVER put BLMPay/API or service-role secrets here. -->
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ================= AUTHORITY PRESS + LIVE I|ONE PRICING ================= */
(function(){
  const FALLBACK = {
    "2weeks": {id:"2weeks",name:"2 WEEKS",days:14,amount:3000},
    "1month": {id:"1month",name:"1 MONTH",days:30,amount:5000},
    "3months": {id:"3months",name:"3 MONTHS",days:90,amount:12000}
  };

  window.ioneRemotePlansReady=false;

  function setPlanAmount(id,amount){
    if(typeof IONE_UPLOAD_PLANS!=="undefined" && IONE_UPLOAD_PLANS[id]) IONE_UPLOAD_PLANS[id].amount=Number(amount);
    const map={"2weeks":"twoWeeks","1month":"oneMonth","3months":"threeMonths"};
    if(typeof IONE_UPLOAD_PLANS!=="undefined" && IONE_UPLOAD_PLANS[map[id]]) IONE_UPLOAD_PLANS[map[id]].amount=Number(amount);
  }

  async function loadLivePlans(){
    try{
      const r=await heavensSupabase.functions.invoke("ione-subscription-plans",{body:{action:"get"}});
      if(r.error || !r.data?.success) throw new Error(r.data?.error || r.error?.message || "Could not load prices.");
      (r.data.plans||[]).forEach(p=>setPlanAmount(p.id,p.amount));
      window.ioneRemotePlansReady=true;
      updateOpenGate();
      return r.data.plans||[];
    }catch(e){
      console.warn("I|ONE live pricing:",e);
      return [];
    }
  }

  function updateOpenGate(){
    const gate=document.getElementById("ioneSubscriptionGate");
    if(!gate)return;
    const map={"2weeks":"twoWeeks","1month":"oneMonth","3months":"threeMonths"};
    gate.querySelectorAll(".ione-sub-plan").forEach(btn=>{
      const id=btn.dataset.plan;
      const key=map[id];
      const plan=key && typeof IONE_UPLOAD_PLANS!=="undefined" ? IONE_UPLOAD_PLANS[key] : null;
      const span=btn.querySelector("span");
      if(plan&&span)span.textContent="TZS "+Number(plan.amount).toLocaleString("en-US");
    });
  }

  window.ioneRefreshLivePlans=loadLivePlans;

  async function openAuthorityPanel(){
    const panel=document.getElementById("authorityPressPanel");
    if(!panel)return;
    panel.style.display="block";
    panel.setAttribute("aria-hidden","false");
    const status=document.getElementById("authorityPriceStatus");
    if(status)status.textContent="Loading…";
    try{
      const r=await heavensSupabase.functions.invoke("ione-subscription-plans",{body:{action:"get"}});
      if(r.error || !r.data?.success)throw new Error(r.data?.error || r.error?.message || "Could not load prices.");
      const plans=r.data.plans||[];
      const inputs={
        "2weeks":document.getElementById("authorityPrice2weeks"),
        "1month":document.getElementById("authorityPrice1month"),
        "3months":document.getElementById("authorityPrice3months")
      };
      plans.forEach(p=>{if(inputs[p.id])inputs[p.id].value=Number(p.amount);setPlanAmount(p.id,p.amount);});
      if(status)status.textContent="CONNECTED • LIVE";
    }catch(e){
      if(status)status.textContent="Could not load live prices.";
    }
  }

  function authorityEsc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(ch){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]})}
  let chapChapAuthorityFilter="orders";
  let chapChapAuthorityCache=null;
  function renderChapChapAuthority(data){
    const status=document.getElementById("authorityChapChapLoadStatus"),list=document.getElementById("authorityChapChapOrders"),orders=data?.orders||[],counts=data?.counts||{};
    ["Orders","Agreements","Receipts","Payouts"].forEach((x,i)=>{const el=document.getElementById(["chapChapOrdersCount","chapChapAgreementsCount","chapChapReceiptsCount","chapChapPayoutsCount"][i]);if(el)el.textContent=String([counts.orders,counts.agreements,counts.receipts,counts.payouts][i]??0);});
    if(!list)return;
    let rows=[];
    if(chapChapAuthorityFilter==="orders") rows=orders;
    else if(chapChapAuthorityFilter==="agreements") rows=orders.filter(o=>o.has_agreement);
    else if(chapChapAuthorityFilter==="receipts") rows=orders.filter(o=>o.has_receipt);
    else rows=orders.filter(o=>o.payout_record || (o.payout_status!=="completed" && ["paid","received"].includes(String(o.status||"").toLowerCase())));
    if(!rows.length){list.innerHTML='<div class="authority-chapchap-order"><strong>NOTHING IN THIS SECTION YET</strong><div class="cc-mini">No matching ChapChap records in this section.</div></div>';if(status)status.textContent="CONNECTED • READY";return;}
    if(chapChapAuthorityFilter==="orders"){
      list.innerHTML=rows.map(o=>{const p=o.product||{};return '<div class="authority-chapchap-order"><strong>'+authorityEsc(p.title||"CHAPCHAP ORDER")+'</strong><div class="cc-mini">ORDER '+authorityEsc(o.id)+'<br>CLIENT: '+authorityEsc(o.buyer_full_name||"—")+' • '+authorityEsc(o.buyer_phone||o.buyer_contact||"—")+'<br>AMOUNT: TZS '+Number(o.amount_tzs||0).toLocaleString("en-US")+'<br>STATUS: '+authorityEsc(String(o.status||"").toUpperCase())+'</div></div>';}).join("");
    }else if(chapChapAuthorityFilter==="agreements"){
      list.innerHTML=rows.map(o=>{const a=o.agreement_record||{};return '<div class="authority-chapchap-order"><strong>SELLER AGREEMENT</strong><div class="cc-mini">SELLER: '+authorityEsc(a.seller_name||"—")+'<br>PHONE: '+authorityEsc(a.seller_phone||"—")+'<br>EMAIL: '+authorityEsc(a.seller_email||"—")+'<br>ADDRESS: '+authorityEsc(a.seller_address||"—")+'<br>TERMS: '+authorityEsc(a.terms_version||"—")+'</div></div>';}).join("");
    }else if(chapChapAuthorityFilter==="receipts"){
      list.innerHTML=rows.map(o=>{const r=o.receipt||{};return '<div class="authority-chapchap-order"><strong>OFFICIAL RECEIPT • '+authorityEsc(r.receipt_number||"—")+'</strong><div class="cc-mini">PRODUCT: '+authorityEsc(r.product_title||"—")+'<br>CLIENT: '+authorityEsc(r.buyer_full_name||o.buyer_full_name||"—")+'<br>PHONE: '+authorityEsc(r.buyer_contact||o.buyer_phone||"—")+'<br>EMAIL: '+authorityEsc(r.buyer_email||o.buyer_email||"—")+'<br>ADDRESS: '+authorityEsc(r.buyer_address||o.buyer_address||"—")+'<br>PRODUCT PRICE: TZS '+Number(r.amount_tzs||o.amount_tzs||0).toLocaleString("en-US")+'<br>CHAPCHAP FEE (1%): TZS '+Number(r.chapchap_fee_tzs||o.commission_tzs||0).toLocaleString("en-US")+'<br>BLMPAY MOBILE FEE (3%): TZS '+Number(r.blmpay_payment_fee_tzs||o.blmpay_payment_fee_tzs||0).toLocaleString("en-US")+'<br>SELLER BALANCE: TZS '+Number(r.seller_available_tzs||o.seller_available_tzs||o.seller_net_tzs||0).toLocaleString("en-US")+'<br>BLMPAY: '+authorityEsc(r.blmpay_reference||"—")+'</div><div style="display:flex;gap:7px;margin-top:8px"><button type="button" class="cc-primary" data-authority-receipt="'+authorityEsc(o.id)+'" style="flex:1;min-height:38px">VIEW RECEIPT</button><button type="button" class="cc-secondary" data-authority-download="'+authorityEsc(o.id)+'" style="flex:1;min-height:38px">DOWNLOAD</button></div></div>';}).join("");
    }else{
      const groups=data?.seller_groups||[];
      const recent=data?.recent_seller_payouts||[];
      if(!groups.length && !recent.length){list.innerHTML='<div class="authority-chapchap-order"><strong>NO UNPAID SELLER BALANCES</strong><div class="cc-mini">Each seller appears once. Completed payouts remain in the payout history.</div></div>';}
      else{
        const groupHtml=groups.map(g=>{
          const key=authorityEsc(g.seller_id||"");
          const products=(g.products||[]).map(p=>'<div style="padding:6px 0;border-top:1px solid #1b3034"><b>'+authorityEsc(p.title||"PRODUCT")+'</b><br>SALE: TZS '+Number(p.amount_tzs||0).toLocaleString("en-US")+' • SELLER BALANCE: TZS '+Number(p.seller_available_tzs||0).toLocaleString("en-US")+'</div>').join("");
          return '<div class="authority-chapchap-order"><strong>PAYOUT • '+authorityEsc(g.seller_name||"SELLER")+'</strong><div class="cc-mini">SELLER: '+authorityEsc(g.seller_name||"—")+'<br>NUMBER: '+authorityEsc(g.seller_phone||"—")+'<br>UNPAID PRODUCTS: '+Number((g.products||[]).length)+'<br>COMBINED SELLER BALANCE: TZS '+Number(g.seller_balance_tzs||0).toLocaleString("en-US")+'</div><div style="margin-top:8px">'+products+'</div><div class="authority-payout-grid" style="margin-top:9px"><input id="payoutName_'+key+'" placeholder="Seller name" value="'+authorityEsc(g.seller_name||"")+'"><input id="payoutPhone_'+key+'" inputmode="tel" placeholder="Seller number" value="'+authorityEsc(g.seller_phone||"")+'"><select id="payoutNetwork_'+key+'"><option value="">NETWORK</option><option>MPESA</option><option>AIRTEL_MONEY</option><option>MIXX_BY_YAS</option><option>HALOPESA</option><option>EZYPESA</option><option>TTCLPESA</option></select><input id="payoutAmount_'+key+'" inputmode="numeric" placeholder="Combined seller balance TZS" value="'+Number(g.seller_balance_tzs||0)+'" readonly><button type="button" data-live-payout="'+key+'">CALCULATE FEE &amp; SEND ONE PAYOUT</button></div></div>';
        }).join("");
        const history=recent.map(p=>'<div class="authority-chapchap-order"><strong>SELLER PAYOUT • '+authorityEsc(p.seller_name||"SELLER")+'</strong><div class="cc-mini">STATUS: '+authorityEsc(String(p.status||"").toUpperCase())+'<br>SELLER BALANCE: TZS '+Number(p.total_seller_balance_tzs||0).toLocaleString("en-US")+'<br>SELLER RECEIVED: TZS '+Number(p.payout_amount_tzs||0).toLocaleString("en-US")+'<br>BLMPAY FEE: TZS '+Number(p.blmpay_fee_tzs||0).toLocaleString("en-US")+'<br>TOTAL DEBIT: TZS '+Number(p.total_debit_tzs||0).toLocaleString("en-US")+'<br>PRODUCTS INCLUDED: '+Number((p.order_ids||[]).length)+'<br>BLMPAY REFERENCE: '+authorityEsc(p.blmpay_reference||"—")+'</div></div>').join("");
        list.innerHTML=groupHtml+(history?'<div style="margin-top:8px;color:#00ffff;font:900 11px Arial">RECENT SELLER PAYOUTS</div>'+history:"");
      }
    }
    list.querySelectorAll("[data-authority-receipt],[data-authority-download]").forEach(btn=>btn.addEventListener("click",()=>{const o=orders.find(x=>String(x.id)===String(btn.getAttribute("data-authority-receipt")||btn.getAttribute("data-authority-download")));const r=o?.receipt;if(!r)return;if(btn.hasAttribute("data-authority-download"))window.ioneChapChapDownloadReceipt?.(r);else window.ioneChapChapOpenReceipt?.(r);}));
    list.querySelectorAll("[data-live-payout]").forEach(btn=>btn.addEventListener("click",()=>sendChapChapPayout(btn.getAttribute("data-live-payout"))));
    if(status)status.textContent="CONNECTED • READY";
  }

  async function loadChapChapAuthority(force=false){
    const status=document.getElementById("authorityChapChapLoadStatus");
    const password=String(document.getElementById("authorityPasswordInput")?.value||"");
    if(!password){if(status)status.textContent="Unlock Authority Press first.";return;}
    if(!force&&chapChapAuthorityCache){renderChapChapAuthority(chapChapAuthorityCache);return;}
    if(status)status.textContent="Loading marketplace data…";
    try{
      const r=await heavensSupabase.functions.invoke("ione-chapchap-authority",{body:{action:"list",password}});
      if(r.error||!r.data?.success)throw new Error(r.data?.error||r.error?.message||"Could not load ChapChap management data.");
      chapChapAuthorityCache=r.data;
      renderChapChapAuthority(r.data);
    }catch(e){if(status)status.textContent=e?.message||"Could not load ChapChap management data.";}
  }

  async function sendChapChapPayout(sellerId){
    const password=String(document.getElementById("authorityPasswordInput")?.value||""),name=String(document.getElementById("payoutName_"+sellerId)?.value||"").trim(),phone=String(document.getElementById("payoutPhone_"+sellerId)?.value||"").trim(),network=String(document.getElementById("payoutNetwork_"+sellerId)?.value||"").trim(),amount=Number(document.getElementById("payoutAmount_"+sellerId)?.value||0),status=document.getElementById("authorityChapChapLoadStatus"),button=document.querySelector('[data-live-payout="'+sellerId+'"]');
    if(!name||!phone||!network||!Number.isInteger(amount)||amount<=0){if(status)status.textContent="Enter seller name, seller number and network.";return;}
    if(button)button.disabled=true;if(status)status.textContent="Calculating combined seller payout…";
    try{
      const q=await heavensSupabase.functions.invoke("ione-chapchap-authority",{body:{action:"payout_quote",password,seller_id:sellerId,seller_name:name,recipient_phone:phone,recipient_network:network}});
      if(q.error||!q.data?.success){
        let detail=q.data?.error||q.error?.message||"Could not verify the seller payout.";
        try{const ctx=q.error?.context;if(ctx&&typeof ctx.json==="function"){const body=await ctx.json();detail=body?.error||body?.message||detail;if(body?.details)detail+=" • "+JSON.stringify(body.details);}}catch(_){}
        throw new Error(detail);
      }
      const d=q.data;
      const productLines=(d.products||[]).map(p=>"• Product order "+p.order_id+": seller balance TZS "+Number(p.seller_available_tzs||0).toLocaleString("en-US")).join("\n");
      const yes=confirm("CONFIRM ONE SELLER PAYOUT\n\nVerified account: "+d.account_name+"\nNumber: "+d.recipient_phone+"\nNetwork: "+d.network+"\nProducts included: "+Number(d.order_count||0)+"\n\nCombined seller balance: TZS "+Number(d.seller_balance_tzs||0).toLocaleString("en-US")+"\nBLMPay payout fee: TZS "+Number(d.fee_tzs||0).toLocaleString("en-US")+"\nSeller receives: TZS "+Number(d.amount_tzs||0).toLocaleString("en-US")+"\nTotal debit from seller balance: TZS "+Number(d.total_debit_tzs||0).toLocaleString("en-US")+"\n\n"+productLines+"\n\nPress OK to SEND ONE PAYOUT, or Cancel.");
      if(!yes){if(status)status.textContent="Payout cancelled. No money was sent.";if(button)button.disabled=false;return;}
      if(status)status.textContent="Sending one seller payout…";
      const sent=await heavensSupabase.functions.invoke("ione-chapchap-authority",{body:{action:"payout_send",password,seller_id:sellerId,account_name:d.account_name,recipient_phone:d.recipient_phone,recipient_network:d.network,amount_tzs:d.amount_tzs,fee_tzs:d.fee_tzs,seller_balance_tzs:d.seller_balance_tzs,total_debit_tzs:d.total_debit_tzs}});
      if(sent.error||!sent.data?.success){
        let detail=sent.data?.error||sent.error?.message||"Payout could not be sent.";
        try{const ctx=sent.error?.context;if(ctx&&typeof ctx.json==="function"){const body=await ctx.json();detail=body?.error||body?.message||detail;if(body?.details)detail+=" • "+JSON.stringify(body.details);}}catch(_){}
        throw new Error(detail);
      }
      if(status)status.textContent=sent.data.message||"Seller payout submitted.";
      await loadChapChapAuthority(true);
    }catch(e){if(status)status.textContent=e?.message||"Payout failed.";if(button)button.disabled=false;}
  }

  async function decorateOwnerBook(){
    const list=document.getElementById('aflOwnerInquiryList');
    if(!list)return;
    const cards=[...list.querySelectorAll('.afl-inquiry-card[data-inquiry-id]')];
    if(!cards.length)return;
    let book=list.querySelector('.afl-owner-book');
    if(book){
      const pages=book.querySelector('.afl-book-pages');
      cards.forEach(c=>{if(c.parentElement!==pages)pages.appendChild(c);});
      book._cards=cards;
      if(book._current==null)book._current=0;
      showPage(book,Math.min(book._current,cards.length-1));
      return;
    }
    const first=cards[0];
    const title=first.querySelector('.afl-inquiry-title')?.textContent||'BRAND';
    const brandName=title.split(' • ')[0]||'BRAND';
    book=document.createElement('div');book.className='afl-owner-book';book._cards=cards;book._current=0;
    const cover=document.createElement('div');cover.className='afl-owner-book-cover';cover.innerHTML='<div class="afl-owner-book-cover-fallback">'+escapeHtml(brandName)+'</div>';
    const brand=document.createElement('div');brand.className='afl-owner-book-brand';brand.textContent=brandName;
    const sub=document.createElement('div');sub.className='afl-owner-book-sub';sub.textContent='PRIVATE CLIENT BOOK • I|ONE';
    const nav=document.createElement('div');nav.className='afl-owner-book-nav';nav.innerHTML='<button type="button" class="afl-book-nav-btn afl-book-prev">‹ PREVIOUS</button><div class="afl-book-page-count">PAGE 1 / '+cards.length+'</div><button type="button" class="afl-book-nav-btn afl-book-next">NEXT ›</button>';
    const alert=document.createElement('button');alert.type='button';alert.className='afl-book-new-alert';alert.textContent='NEW CLIENT INFORMATION';
    const pages=document.createElement('div');pages.className='afl-book-pages';cards.forEach(c=>pages.appendChild(c));
    book.append(cover,brand,sub,nav,alert,pages);list.innerHTML='';list.appendChild(book);
    book.querySelector('.afl-book-prev').onclick=()=>showPage(book,book._current-1);
    book.querySelector('.afl-book-next').onclick=()=>showPage(book,book._current+1);
    alert.onclick=()=>{const idx=Number(book.dataset.newIndex);if(Number.isFinite(idx))showPage(book,idx);};
    const firstQ=cards[0]?.dataset.inquiryId;
    if(firstQ){
      try{
        const {data:item}=await heavensSupabase.from('afrilink_billboard_items').select('image_url').eq('billboard_id',cards[0].dataset.billboardId||'').eq('active',true).order('sort_order',{ascending:true}).limit(1).maybeSingle();
        if(item?.image_url){cover.innerHTML='<img src="'+escapeHtml(item.image_url)+'" alt="Brand cover">';}
      }catch(_){ }
    }
    cards.forEach((c,i)=>{c.dataset.bookIndex=String(i);if(i===0)c.classList.add('afl-book-current');});
    showPage(book,0);
  }
  function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function showPage(book,index){
    const cards=book._cards||[];if(!cards.length)return;
    const previous=Number.isFinite(book._current)?book._current:null;
    index=(index+cards.length)%cards.length;
    if(previous!==null&&previous!==index&&cards[previous]){cards[previous].classList.remove('afl-book-current');cards[previous].classList.add('afl-page-turn-out');setTimeout(()=>cards[previous]?.classList.remove('afl-page-turn-out'),360);}
    book._current=index;
    cards.forEach((c,i)=>{c.classList.remove('afl-book-current');if(i!==previous)c.classList.remove('afl-page-turn-out','afl-page-turn-in');});
    const current=cards[index];current.classList.add('afl-book-current');if(previous!==null&&previous!==index){current.classList.add('afl-page-turn-in');setTimeout(()=>current.classList.remove('afl-page-turn-in'),460);}
    const count=book.querySelector('.afl-book-page-count');if(count)count.textContent='PAGE '+(index+1)+' / '+cards.length;
    const prev=book.querySelector('.afl-book-prev'),next=book.querySelector('.afl-book-next');
    if(prev)prev.disabled=cards.length<2;if(next)next.disabled=cards.length<2;
    if(current){const b=current.querySelector('.afl-owner-refresh');if(b&&current.dataset.pendingNewMessageId){b.classList.remove('has-new');current.dataset.pendingNewMessageId='';}}
    const alert=book.querySelector('.afl-book-new-alert');if(alert){alert.classList.remove('show');book.dataset.newIndex='';}
  }
  function signalNew(inquiryId){
    const list=document.getElementById('aflOwnerInquiryList');const book=list?.querySelector('.afl-owner-book');if(!book)return;
    const cards=book._cards||[];const idx=cards.findIndex(c=>String(c.dataset.inquiryId)===String(inquiryId));if(idx<0)return;
    const card=cards[idx];card.dataset.pendingNewMessageId='pending';
    const b=card.querySelector('.afl-owner-refresh');if(b){b.classList.add('has-new');b.title='New incoming message available';}
    const alert=book.querySelector('.afl-book-new-alert');if(alert){const name=card.querySelector('.afl-inquiry-title')?.textContent?.split(' • ')[0]||'CLIENT';alert.textContent='NEW INFO FROM '+name;alert.classList.add('show');book.dataset.newIndex=String(idx);}
  }
  window.aflSignalOwnerNewClient=signalNew;

  /* Override refresh with the book wrapper while preserving all existing database behavior. */
  const baseRefresh=window.aflRefreshOwnerInquiries;
  if(typeof baseRefresh==='function'){
    window.aflRefreshOwnerInquiries=async function(uid,silent=false){
      await baseRefresh(uid,silent);
      await decorateOwnerBook();
      const list=document.getElementById('aflOwnerInquiryList');
      list?.querySelectorAll('.afl-inquiry-card').forEach(card=>{
        const b=card.querySelector('.afl-owner-refresh');
        if(b&&!b.dataset.bookBound){
          b.dataset.bookBound='1';
          b.addEventListener('click',()=>{clearOwnerNew(card);const book=list.querySelector('.afl-owner-book');const idx=Number(card.dataset.bookIndex);if(book&&Number.isFinite(idx))showPage(book,idx);});
        }
      });
    };
  }

  /* Replace owner realtime new-message handling with book-aware signaling. */
  const baseStart=window.aflStartOwnerRealtime;
  if(typeof baseStart==='function'){
    window.aflStartOwnerRealtime=function(uid){
      baseStart(uid);
      /* The original realtime listener already paints VIEW NEW. Our lightweight
         observer converts that state into a book-page notification without
         changing the delivery path. */
      if(window._aflBookWatch)clearInterval(window._aflBookWatch);
      window._aflBookWatch=setInterval(()=>{
        const list=document.getElementById('aflOwnerInquiryList');const book=list?.querySelector('.afl-owner-book');if(!book)return;
        (book._cards||[]).forEach(card=>{if(card.dataset.pendingNewMessageId)signalNew(card.dataset.inquiryId);});
      },700);
    };
  }

  /* Every newly created inquiry gets the brand's saved welcome text, if present.
     The existing waiting-message function remains the source of truth; this
     only ensures the greeting is offered independently for every inquiry. */
  const oldEnsure=window.aflEnsureWaitingMessage;
  window.aflEnsureWaitingMessage=async function(q,uid){
    return oldEnsure.apply(this,arguments);
  };

  /* Keep the two camera buttons available on the old call overlay as well. */
  ['aflFrontCameraOutgoing','aflRearCameraOutgoing','aflFrontCameraActive','aflRearCameraActive'].forEach(id=>{
    const b=document.getElementById(id);if(b){b.classList.add('afl-shiny-camera');}
  });
})();
</script>

<script>
/* =========================================================
   I|ONE POLISH PATCH • INLINE CAMERA + CLIENT VIEW NEW +
   FULL BRAND CLIENT BOOK

(function(){

  document.head.appendChild(style);

  function getClientName(card){
    if(!card)return 'CLIENT';
    if(card.dataset.clientName)return card.dataset.clientName;
    const rows=[...card.querySelectorAll('.afl-inquiry-data > div')];
    for(const row of rows){
      const text=String(row.textContent||'').trim();
      const m=text.match(/^NAME\s*:\s*(.+)$/i);
      if(m&&m[1].trim())return m[1].trim();
    }
    const title=card.querySelector('.afl-inquiry-title')?.textContent||'';
    return (title.split(' • ')[0]||'CLIENT').trim();
  }

  function bookCoverImage(book){
    const old=book.querySelector('.afl-owner-book-cover img');
    return old?.getAttribute('src')||'';
  }

  function ensureCoverScreen(book){
    if(!book)return null;
    let screen=book.querySelector('.afl-book-cover-screen');
    if(screen)return screen;
    const cards=book._cards||[...book.querySelectorAll('.afl-inquiry-card')];
    const first=cards[0];
    const brandName=book.querySelector('.afl-owner-book-brand')?.textContent||'I|ONE';
    const src=bookCoverImage(book);
    screen=document.createElement('div');
    screen.className='afl-book-cover-screen';
    const bg=document.createElement('div');bg.className='afl-book-cover-screen-bg';
    if(src)bg.style.backgroundImage='url("'+src.replace(/"/g,'&quot;')+'")';
    const main=document.createElement('div');main.className='afl-book-cover-screen-main';
    if(src){const img=document.createElement('img');img.src=src;img.alt='Brand cover';main.appendChild(img);}
    else{const fallback=document.createElement('div');fallback.className='afl-book-cover-screen-fallback';fallback.textContent=brandName;main.appendChild(fallback);}
    const title=document.createElement('div');title.className='afl-book-cover-screen-title';title.textContent=brandName;
    const sub=document.createElement('div');sub.className='afl-book-cover-screen-sub';sub.textContent='PRIVATE CLIENT INFORMATION BOOK • I|ONE';
    const enter=document.createElement('button');enter.type='button';enter.className='afl-book-enter';enter.textContent='VIEW INFOS';
    const alert=document.createElement('button');alert.type='button';alert.className='afl-book-cover-alert';alert.textContent='NEW INFO';
    screen.append(bg,main,title,sub,enter,alert);
    book.insertBefore(screen,book.firstChild);

    const openTo=(idx)=>{
      book.classList.add('afl-book-open');
      book.dataset.opened='1';
      if(typeof window.aflOwnerBookShowPage==='function')window.aflOwnerBookShowPage(book,idx);
      else{
        const pages=book._cards||[];pages.forEach((c,i)=>c.classList.toggle('afl-book-current',i===idx));
      }
    };
    enter.onclick=()=>openTo(Number(book.dataset.newIndex||book._current||0));
    alert.onclick=()=>openTo(Number(book.dataset.newIndex||book._current||0));
    book._openToClient=openTo;
    return screen;
  }

  function refreshBookClientLabels(book){
    const cards=book?._cards||[];
    cards.forEach(card=>{
      const name=getClientName(card);
      card.dataset.clientName=name;
      let label=card.querySelector('.afl-book-page-client');
      if(!label){
        label=document.createElement('div');
        label.className='afl-book-page-client';
        const head=card.querySelector('.afl-inquiry-head');
        if(head)head.insertBefore(label,head.firstChild);else card.insertBefore(label,card.firstChild);
      }
      label.textContent=name;
    });
  }

  function mirrorBookAlert(book){
    if(!book)return;
    const alert=book.querySelector('.afl-book-new-alert');
    const coverAlert=book.querySelector('.afl-book-cover-alert');
    if(!alert||!coverAlert)return;
    const idx=Number(book.dataset.newIndex);
    const cards=book._cards||[];
    const card=Number.isFinite(idx)&&cards[idx]?cards[idx]:null;
    if(card){
      const name=getClientName(card);
      const text='NEW INFO FROM '+name;
      if(alert.textContent!==text)alert.textContent=text;
      if(coverAlert.textContent!==text)coverAlert.textContent=text;
      coverAlert.classList.toggle('show',alert.classList.contains('show'));
    }else coverAlert.classList.remove('show');
  }

  function syncCoverScreenImage(book){
    const screen=book?.querySelector('.afl-book-cover-screen');
    const oldImg=book?.querySelector('.afl-owner-book-cover img');
    if(!screen||!oldImg?.src)return;
    const main=screen.querySelector('.afl-book-cover-screen-main');
    const bg=screen.querySelector('.afl-book-cover-screen-bg');
    if(bg)bg.style.backgroundImage='url(\"'+oldImg.src.replace(/\"/g,'&quot;')+'\")';
    if(main){
      let img=main.querySelector('img');
      if(!img){main.innerHTML='';img=document.createElement('img');main.appendChild(img);}
      if(img.src!==oldImg.src)img.src=oldImg.src;
    }
  }

  function upgradeBook(book){
    if(!book)return;
    ensureCoverScreen(book);
    syncCoverScreenImage(book);
    refreshBookClientLabels(book);
    mirrorBookAlert(book);
    if(!book._polishedBound){
      book._polishedBound=true;
      const alert=book.querySelector('.afl-book-new-alert');
      if(alert){
        const observer=new MutationObserver(()=>mirrorBookAlert(book));
        observer.observe(alert,{attributes:true,attributeFilter:['class'],childList:true,subtree:true,characterData:true});
      }
    }
    /* The existing VIEW NEW alert now opens the full book and lands on that client. */
    const alert=book.querySelector('.afl-book-new-alert');
    if(alert)alert.onclick=()=>{
      const idx=Number(book.dataset.newIndex);book.classList.add('afl-book-open');book.dataset.opened='1';
      const fn=window.aflOwnerBookShowPage;if(typeof fn==='function')fn(book,Number.isFinite(idx)?idx:0);
    };
    const cover=book.querySelector('.afl-book-cover-screen');
    if(cover){
      const btn=cover.querySelector('.afl-book-cover-alert');
      if(btn)btn.onclick=()=>{
        const idx=Number(book.dataset.newIndex);book.classList.add('afl-book-open');book.dataset.opened='1';
        const fn=window.aflOwnerBookShowPage;if(typeof fn==='function')fn(book,Number.isFinite(idx)?idx:0);
      };
    }
  }

  /* Export a safe page navigation helper that preserves the existing book page-turn design. */
  window.aflOwnerBookShowPage=function(book,index){
    const cards=book?._cards||[];if(!cards.length)return;
    index=(index+cards.length)%cards.length;
    cards.forEach((c,i)=>{
      c.classList.toggle('afl-book-current',i===index);
      if(i!==index)c.classList.remove('afl-page-turn-in');
    });
    book._current=index;
    const count=book.querySelector('.afl-book-page-count');if(count)count.textContent='PAGE '+(index+1)+' / '+cards.length;
    const prev=book.querySelector('.afl-book-prev'),next=book.querySelector('.afl-book-next');
    if(prev)prev.disabled=cards.length<2;if(next)next.disabled=cards.length<2;
    const current=cards[index];
    if(current){
      const b=current.querySelector('.afl-owner-refresh');
      if(b&&current.dataset.pendingNewMessageId){b.classList.remove('has-new');current.dataset.pendingNewMessageId='';}
    }
    const alert=book.querySelector('.afl-book-new-alert');
    if(alert){alert.classList.remove('show');book.dataset.newIndex='';}
    const coverAlert=book.querySelector('.afl-book-cover-alert');if(coverAlert)coverAlert.classList.remove('show');
  };

  /* Preserve the currently opened client page when the existing realtime refresh rebuilds the cards. */
  const originalRefresh=window.aflRefreshOwnerInquiries;
  if(typeof originalRefresh==='function'){
    window.aflRefreshOwnerInquiries=async function(uid,silent=false){
      const oldBook=document.getElementById('aflOwnerInquiryList')?.querySelector('.afl-owner-book');
      const oldOpen=!!oldBook?.classList.contains('afl-book-open');
      const oldClient=oldBook?._cards?.[Number(oldBook._current)]?.dataset?.inquiryId||'';
      await originalRefresh(uid,silent);
      const book=document.getElementById('aflOwnerInquiryList')?.querySelector('.afl-owner-book');
      if(!book)return;
      upgradeBook(book);
      if(oldOpen){
        book.classList.add('afl-book-open');book.dataset.opened='1';
        const idx=(book._cards||[]).findIndex(c=>String(c.dataset.inquiryId)===String(oldClient));
        if(idx>=0)window.aflOwnerBookShowPage(book,idx);
      }
    };
  }

  /* Re-run the visual upgrade whenever the inbox DOM changes, including a newly created client page. */
  const list=document.getElementById('aflOwnerInquiryList');
  if(list){
    const mo=new MutationObserver(()=>{
      const book=list.querySelector('.afl-owner-book');if(book)upgradeBook(book);
    });
    mo.observe(list,{childList:true,subtree:true});
  }

  /* Client VIEW NEW: ensure incoming voice/text messages trigger the same breathing UI. */
  const refreshClientButton=document.getElementById('aflChatRefresh');
  if(refreshClientButton){
    refreshClientButton.classList.remove('has-new');
  }
})();

      const count=book.querySelector('.afl-def-count');if(count)count.textContent=`PAGE ${idx+1} / ${pages.length}`;
      const newBtn=book.querySelector('.afl-def-new-page');
      if(newBtn){newBtn.classList.remove('show');book._newIndex='';}
      if(pages[idx]){
        const b=pages[idx].querySelector('.afl-owner-refresh');
        if(b){b.classList.remove('has-new');b.title='View new messages';}
        pages[idx].dataset.pendingNewMessageId='';
      }
    };
    book._showPage=show;
    book.querySelector('.afl-def-prev').onclick=()=>show(book._page-1);
    book.querySelector('.afl-def-next').onclick=()=>show(book._page+1);
    book.querySelector('.afl-def-back').onclick=()=>{book.classList.remove('open');book._page=0;};
    show(book._page||0);
  }

  async function buildDefBook(){
    const list=document.getElementById('aflOwnerInquiryList');if(!list)return;
    const cards=[...list.querySelectorAll('.afl-inquiry-card[data-inquiry-id]')];
    if(!cards.length)return;
    /* Remove any older generated book wrappers but keep the real inquiry cards. */
    cards.forEach(c=>{c.classList.remove('afl-book-current','afl-page-turn-in','afl-page-turn-out');});
    let book=document.getElementById('aflDefBrandBook');
    if(book){book.remove();}
    const first=cards[0];
    const brand=first.querySelector('.afl-inquiry-title')?.textContent?.split(' • ')[0]||'I|ONE';
    book=document.createElement('div');book.id='aflDefBrandBook';book.className='afl-def-book';
    const cover=document.createElement('section');cover.className='afl-def-book-cover';
    const bg=document.createElement('div');bg.className='afl-def-book-cover-bg';
    const art=document.createElement('div');art.className='afl-def-book-cover-art';
    const fallback=document.createElement('div');fallback.className='afl-def-book-cover-fallback';fallback.textContent=brand;art.appendChild(fallback);
    const title=document.createElement('div');title.className='afl-def-book-title';title.textContent=brand;
    const sub=document.createElement('div');sub.className='afl-def-book-sub';sub.textContent='PRIVATE CLIENT INFORMATION • I|ONE';
    const enter=document.createElement('button');enter.type='button';enter.className='afl-def-book-enter';enter.textContent='VIEW INFOS';
    const coverAlert=document.createElement('button');coverAlert.type='button';coverAlert.className='afl-def-book-alert';coverAlert.textContent='NEW INFO';
    cover.append(bg,art,title,sub,enter,coverAlert);
    const pagesWrap=document.createElement('div');pagesWrap.className='afl-def-book-pages';
    const pages=[];
    cards.forEach((card,i)=>{
      card.classList.add('afl-def-book-page');
      card.dataset.defBookIndex=String(i);
      const oldLabel=card.querySelector('.afl-def-client-name');if(oldLabel)oldLabel.remove();
      const label=document.createElement('div');label.className='afl-def-client-name';label.textContent=clientName(card);card.dataset.clientName=clientName(card);
      const head=card.querySelector('.afl-inquiry-head');if(head)head.insertBefore(label,head.firstChild);else card.insertBefore(label,card.firstChild);
      pagesWrap.appendChild(card);pages.push(card);
    });
    const controls=document.createElement('div');controls.className='afl-def-book-controls';controls.innerHTML='<button type="button" class="afl-def-nav afl-def-prev">‹ PREVIOUS</button><div class="afl-def-count">PAGE 1 / '+pages.length+'</div><button type="button" class="afl-def-nav afl-def-next">NEXT ›</button><button type="button" class="afl-def-nav afl-def-back">COVER</button>';
    const newPage=document.createElement('button');newPage.type='button';newPage.className='afl-def-new-page';
    book.append(cover,pagesWrap,controls,newPage);
    list.innerHTML='';list.appendChild(book);book._pages=pages;book._page=0;book._newIndex='';
    wirePageButtons(book);
    const open=(idx=0)=>{book.classList.add('open');book._showPage(idx);};
    enter.onclick=()=>open(book._newIndex===''?0:Number(book._newIndex));
    coverAlert.onclick=()=>open(Number(book._newIndex||0));
    newPage.onclick=()=>open(Number(book._newIndex||0));
    book._openClient=open;
    const coverUrl=await getCoverUrl(first);
    if(coverUrl){
      bg.style.backgroundImage=`url("${coverUrl.replace(/"/g,'&quot;')}")`;
      art.innerHTML='';const img=document.createElement('img');img.src=coverUrl;img.alt='Brand cover';art.appendChild(img);
    }
    /* Any existing incoming state is converted to a named notification. */
    cards.forEach(card=>{
      if(card.dataset.pendingNewMessageId){
        notifyClient(card.dataset.inquiryId);
      }
      const vb=card.querySelector('.afl-owner-refresh');
      if(vb){vb.onclick=(ev)=>{ev.preventDefault();ev.stopPropagation();clearClient(card);open(Number(card.dataset.defBookIndex||0));return false;};}
    });
    return book;
  }

  function clearClient(card){
    card.dataset.pendingNewMessageId='';
    const b=card.querySelector('.afl-owner-refresh');if(b){b.classList.remove('has-new');b.textContent='VIEW NEW';}
  }
  function notifyClient(inquiryId){
    const book=document.getElementById('aflDefBrandBook');if(!book)return;
    const pages=book._pages||[];const idx=pages.findIndex(p=>String(p.dataset.inquiryId)===String(inquiryId));if(idx<0)return;
    const name=clientName(pages[idx]);
    book._newIndex=String(idx);
    const text='NEW INFO FROM '+name;
    const a=book.querySelector('.afl-def-book-alert');if(a){a.textContent=text;a.classList.add('show');}
    const n=book.querySelector('.afl-def-new-page');if(n){n.textContent=text;n.classList.add('show');}
    const vb=pages[idx].querySelector('.afl-owner-refresh');if(vb){vb.classList.add('has-new');vb.title=text;}
  }
  window.aflSignalOwnerNewClient=notifyClient;

  /* Rebuild the book whenever the inbox is opened/refreshed. */
  const currentOpen=window.aflOpenOwnerInquiries;
  if(typeof currentOpen==='function'){
    window.aflOpenOwnerInquiries=async function(){
      await currentOpen.apply(this,arguments);
      const list=document.getElementById('aflOwnerInquiryList');
      setTimeout(()=>buildDefBook().catch(e=>console.warn('I|ONE book:',e)),0);
    };
  }
  const currentRefresh=window.aflRefreshOwnerInquiries;
  if(typeof currentRefresh==='function'){
    window.aflRefreshOwnerInquiries=async function(uid,silent=false){
      await currentRefresh.apply(this,arguments);
      setTimeout(()=>buildDefBook().catch(e=>console.warn('I|ONE book refresh:',e)),0);
    };
  }

  /* Rebind the two top controls so they always work. */
  const close=document.getElementById('aflOwnerClose');
  if(close){close.onclick=()=>{const ov=document.getElementById('aflOwnerOverlay');if(ov){ov.style.display='none';ov.setAttribute('aria-hidden','true');}const t=window.aflOwnerInboxPollTimer;if(t)clearInterval(t);};}
  const refresh=document.getElementById('aflOwnerRefresh');
  if(refresh){refresh.onclick=async()=>{try{const ss=await ensureHeavensAnonymousSession();if(ss?.user?.id)await window.aflRefreshOwnerInquiries(ss.user.id,false);}catch(e){console.warn(e);}};}

  /* Make client VIEW NEW reliable: only incoming messages animate. */
  function clientNotify(){const q=window.aflActiveService?.inquiry;if(!q)return;const b=document.getElementById('aflChatRefresh');if(b){b.classList.add('has-new');b.textContent='VIEW NEW';b.title='New incoming message available';}}
  const oldClientRealtime=window.aflStartClientChatRealtime;
  if(typeof oldClientRealtime==='function'){
    window.aflStartClientChatRealtime=function(inquiryId){
      oldClientRealtime.apply(this,arguments);
      setTimeout(()=>{
        if(window.aflClientChatChannel){/* original realtime remains active */}
      },0);
    };
  }

  /* Camera: accepted inline sessions must never reopen the old overlay. */
  const oldSwitch=window.aflSwitchCamera;
  if(typeof oldSwitch==='function'){
    window.aflSwitchCamera=async function(target){
      const call=window.aflCallState?.call;const accepted=String(call?.status||'').toLowerCase()==='accepted';
      const panel=document.getElementById('aflInlineLivePanel');
      try{return await oldSwitch.apply(this,arguments);}
      finally{
        if(accepted||panel){
          const p=document.getElementById('aflInlineLivePanel');
          const ov=document.getElementById('aflIncomingCallOverlay');
          if(ov){ov.style.display='none';ov.setAttribute('aria-hidden','true');}
          if(p){p.style.display='block';const stage=p.querySelector('.afl-call-video-stage');if(stage)stage.style.display='block';}
        }
      }
    };
  }
})();
/* FINAL GUARANTEE PATCH • direct client/brand VIEW NEW delivery */
(function(){
  let brandTimer=null;
  async function startBrandBookWatcher(){
    if(brandTimer)clearInterval(brandTimer);
    const session=await ensureHeavensAnonymousSession().catch(()=>null);
    const uid=session?.user?.id||'';
    if(!uid)return;
    brandTimer=setInterval(async()=>{
      const book=document.getElementById('aflDefBrandBook');
      if(!book||!book._pages?.length)return;
      for(const card of book._pages){
        const qid=card.dataset.inquiryId;
        if(!qid)continue;
        try{
          const r=await heavensSupabase.from('afrilink_inquiry_messages').select('id,sender_id,created_at').eq('inquiry_id',qid).order('created_at',{ascending:false}).limit(1).maybeSingle();
          const m=r?.data;if(!m)continue;
          const id=String(m.id||'');
          if(!card.dataset.bookBaselineMessageId)card.dataset.bookBaselineMessageId=id;
          if(id!==card.dataset.bookBaselineMessageId && String(m.sender_id||'')!==String(uid)){
            card.dataset.bookBaselineMessageId=id;
            card.dataset.pendingNewMessageId=id;
            if(typeof window.aflSignalOwnerNewClient==='function')window.aflSignalOwnerNewClient(qid);
          }else if(String(m.sender_id||'')===String(uid)){
            card.dataset.bookBaselineMessageId=id;
          }
        }catch(_){ }
      }
    },1200);
  }
  window.addEventListener('beforeunload',()=>{if(brandTimer)clearInterval(brandTimer);});
  const oldOpen=window.aflOpenOwnerInquiries;
  if(typeof oldOpen==='function'){
    window.aflOpenOwnerInquiries=async function(){
      await oldOpen.apply(this,arguments);
      setTimeout(()=>startBrandBookWatcher(),800);
    };
  }

  /* Independent client-side incoming watcher. It never reacts to the client's own messages. */
  let clientTimer=null;
  const oldClientStart=window.aflStartClientChatRealtime;
  if(typeof oldClientStart==='function'){
    window.aflStartClientChatRealtime=function(inquiryId){
      oldClientStart.apply(this,arguments);
      if(clientTimer)clearInterval(clientTimer);
      ensureHeavensAnonymousSession().then(session=>{
        const uid=session?.user?.id||'';
        clientTimer=setInterval(async()=>{
          const q=window.aflActiveService?.inquiry;
          if(!q?.id||String(q.id)!==String(inquiryId))return;
          try{
            const r=await heavensSupabase.from('afrilink_inquiry_messages').select('id,sender_id,created_at').eq('inquiry_id',inquiryId).order('created_at',{ascending:false}).limit(1).maybeSingle();
            const m=r?.data;if(!m)return;
            const id=String(m.id||'');
            if(!window.aflActiveService._viewNewBaseline)window.aflActiveService._viewNewBaseline=id;
            if(id!==window.aflActiveService._viewNewBaseline && String(m.sender_id||'')!==String(uid)){
              window.aflActiveService._viewNewBaseline=id;
              const b=document.getElementById('aflChatRefresh');
              if(b){b.classList.add('has-new');b.textContent='VIEW NEW';b.title='New incoming message available';}
            }else if(String(m.sender_id||'')===String(uid)){
              window.aflActiveService._viewNewBaseline=id;
            }
          }catch(_){ }
        },1200);
      }).catch(()=>{});
    };
  }
  window.addEventListener('beforeunload',()=>{if(clientTimer)clearInterval(clientTimer);});
})();
</script>


<script>
/* =========================================================
   I|ONE FINAL BOOK ENTRY FIX
   The original click handler was attached before the later
   book wrappers were installed. Rebind the actual UI button
   to the final window function and keep the book authoritative.
========================================================= */
(function(){
  function waitForCards(maxMs){
    return new Promise(resolve=>{
      const start=Date.now();
      const tick=()=>{
        const list=document.getElementById('aflOwnerInquiryList');
        const cards=list?.querySelectorAll('.afl-inquiry-card[data-inquiry-id]');
        if(cards&&cards.length)return resolve(true);
        if(Date.now()-start>maxMs)return resolve(false);
        setTimeout(tick,80);
      };
      tick();
    });
  }

  async function openFinalBrandBook(){
    const s=await ensureHeavensAnonymousSession();
    const uid=s?.user?.id;
    if(!uid){alert('Please open I|ONE again so your brand inbox can be connected.');return;}

    const fn=window.aflOpenOwnerInquiries;
    if(typeof fn!=='function')return;

    /* Call the final wrapped inbox opener. */
    await fn();
    await waitForCards(7000);

    /* The latest book builder is intentionally given one extra turn so it
       always runs after the original inquiry renderer has finished. */
    setTimeout(()=>{
      const book=document.getElementById('aflDefBrandBook');
      if(book){
        book.classList.remove('open');
        if(book._showPage)book._showPage(0);
        return;
      }
      /* If a browser skipped a queued wrapper, force the already-installed
         owner refresh path once more. Its final wrapper creates the book. */
      window.aflRefreshOwnerInquiries?.(uid,false).catch(()=>{});
    },60);
  }

  /* CRITICAL: replace the stale handler that captured the pre-book function. */
  const inboxBtn=document.getElementById('aflOwnerInquiries');
  if(inboxBtn){
    inboxBtn.onclick=(e)=>{
      e.preventDefault();
      e.stopPropagation();
      openFinalBrandBook().catch(err=>{
        console.error('I|ONE final book open:',err);
      });
    };
  }

  /* The top refresh button also used to hold the pre-book function. */
  const refreshBtn=document.getElementById('aflOwnerRefresh');
  if(refreshBtn){
    refreshBtn.onclick=async(e)=>{
      e?.preventDefault?.();
      try{
        const s=await ensureHeavensAnonymousSession();
        const uid=s?.user?.id;
        if(!uid)return;
        await window.aflRefreshOwnerInquiries?.(uid,false);
        setTimeout(()=>{
          const book=document.getElementById('aflDefBrandBook');
          if(book&&book._showPage)book._showPage(book._page||0);
        },100);
      }catch(err){console.warn('I|ONE book refresh:',err);}
    };
  }

  /* Make the book's cover image always come from the first billboard image.
     If the active-only lookup fails, fall back to the first stored image. */
  async function ensureFirstBillboardCover(){
    const book=document.getElementById('aflDefBrandBook');
    if(!book)return;
    const pages=book._pages||[];
    const first=pages[0];
    const bid=first?.dataset?.billboardId||'';
    if(!bid)return;
    try{
      let r=await heavensSupabase.from('afrilink_billboard_items')
        .select('image_url,sort_order,active')
        .eq('billboard_id',bid)
        .eq('active',true)
        .order('sort_order',{ascending:true})
        .limit(1).maybeSingle();
      if(!r?.data?.image_url){
        r=await heavensSupabase.from('afrilink_billboard_items')
          .select('image_url,sort_order,active')
          .eq('billboard_id',bid)
          .order('sort_order',{ascending:true})
          .limit(1).maybeSingle();
      }
      const url=r?.data?.image_url||'';
      if(!url)return;
      const art=book.querySelector('.afl-def-book-cover-art');
      const bg=book.querySelector('.afl-def-book-cover-bg');
      if(bg)bg.style.backgroundImage='url("'+url.replace(/"/g,'&quot;')+'")';
      if(art){
        art.innerHTML='';
        const img=document.createElement('img');
        img.src=url;img.alt='Brand cover';
        art.appendChild(img);
      }
      /* Also update the full-screen cover used by the older polish layer. */
      const screen=book.querySelector('.afl-book-cover-screen');
      if(screen){
        const main=screen.querySelector('.afl-book-cover-screen-main');
        const bg2=screen.querySelector('.afl-book-cover-screen-bg');
        if(bg2)bg2.style.backgroundImage='url("'+url.replace(/"/g,'&quot;')+'")';
        if(main){
          main.innerHTML='';
          const img=document.createElement('img');img.src=url;img.alt='Brand cover';main.appendChild(img);
        }
      }
    }catch(err){console.warn('I|ONE cover image:',err);}
  }

  async function stabilizeBook(){
    const book=document.getElementById('aflDefBrandBook');
    if(!book)return;
    await ensureFirstBillboardCover();
    const pages=book._pages||[];
    pages.forEach((card,i)=>{
      card.dataset.defBookIndex=String(i);
      card.dataset.clientName=card.dataset.clientName||'CLIENT';
    });
    if(book._showPage)book._showPage(book._page||0);
  }

  /* Watch only the owner inbox container. If an old renderer replaces the
     book with the raw scrolling cards, restore the final book automatically. */
  const list=document.getElementById('aflOwnerInquiryList');
  if(list){
    let timer=null;
    const observer=new MutationObserver(()=>{
      clearTimeout(timer);
      timer=setTimeout(()=>{
        const cards=list.querySelectorAll('.afl-inquiry-card[data-inquiry-id]');
        const book=document.getElementById('aflDefBrandBook');
        if(cards.length&&!book&&document.getElementById('aflOwnerOverlay')?.getAttribute('aria-hidden')==='false'){
          const refresh=window.aflRefreshOwnerInquiries;
          ensureHeavensAnonymousSession().then(s=>{
            if(s?.user?.id)refresh?.(s.user.id,true).catch(()=>{});
          });
        }
        if(book)stabilizeBook().catch(()=>{});
      },180);
    });
    observer.observe(list,{childList:true,subtree:true});
  }
})();
</script>

      book.style.minHeight='100%';
      book.style.margin='0';
      book.style.borderRadius='0';
      book.style.border='0';
      book.style.zIndex='20';

  function install(){
    const overlay=document.getElementById('aflOwnerOverlay');
    const list=document.getElementById('aflOwnerInquiryList');
    if(!overlay||!list)return;
    const style=document.createElement('style');
    style.textContent=`
      #aflOwnerOverlay .afl-service-card{position:relative!important;width:100%!important;height:100dvh!important;max-width:none!important;margin:0!important;border-radius:0!important;padding:0!important;overflow:hidden!important}

  function install(){
    const original=window.aflRefreshOwnerInquiries;
    if(typeof original==='function' && !window.__afl421RefreshGuard){
      window.__afl421RefreshGuard=true;
      window.aflRefreshOwnerInquiries=async function(uid,silent){
        if(document.getElementById('aflRealBrandBook')){
          protectBook();
          return;
        }
        return original.apply(this,arguments);
      };
    }

    const overlay=document.getElementById('aflOwnerOverlay');
    if(overlay && !window.__afl421BookGuard){
      window.__afl421BookGuard=new MutationObserver(function(){
        protectBook();
      });
      window.__afl421BookGuard.observe(overlay,{childList:true,subtree:true});
    }
    protectBook();
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>setTimeout(install,0),{once:true});
  }else{
    setTimeout(install,0);
  }
})();
</script>
