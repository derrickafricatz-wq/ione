name: I|ONE Live Class isolated checks

on:
  push:
    branches: [feature/ione-live-class-foundation]
    paths:
      - "index.html"
      - "ione-live-class.js"
      - "ione-navigation.js"
      - "sw.js"
      - "version.json"
      - "supabase/functions/ione-live-class/**"
      - "supabase/migrations/*ione_live_class*"
      - "tests/ione-live-class-checks.cjs"
      - ".github/workflows/ione-live-class-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "ione-live-class.js"
      - "ione-navigation.js"
      - "sw.js"
      - "version.json"
      - "supabase/functions/ione-live-class/**"
      - "supabase/migrations/*ione_live_class*"
      - "tests/ione-live-class-checks.cjs"
      - ".github/workflows/ione-live-class-checks.yml"

permissions:
  contents: read

jobs:
  live-class-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Live Class UI, security and migration isolation
        run: node tests/ione-live-class-checks.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the Live Class Edge Function
        run: deno check supabase/functions/ione-live-class/index.ts
