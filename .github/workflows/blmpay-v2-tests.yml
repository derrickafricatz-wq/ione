name: BLMPay V2 signer tests

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/_shared/blmpay-v2.ts"
      - "supabase/functions/_shared/blmpay-v2_test.ts"
      - ".github/workflows/blmpay-v2-tests.yml"
  push:
    branches: ["audit/blmpay-v2-migration"]
    paths:
      - "supabase/functions/_shared/blmpay-v2.ts"
      - "supabase/functions/_shared/blmpay-v2_test.ts"
      - ".github/workflows/blmpay-v2-tests.yml"

permissions:
  contents: read

jobs:
  signer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run isolated signer tests
        run: deno test --allow-env=BLMPAY_V2_API_KEY,BLMPAY_V2_HMAC_SECRET supabase/functions/_shared/blmpay-v2_test.ts
